worker_processes auto;
pid /run/diptera-workspace/nginx.pid;
error_log stderr;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log syslog:server=unix:/dev/log,tag=diptera_workspace;
    sendfile on;
    server_tokens off;

    client_body_temp_path /run/diptera-workspace/client_temp;
    proxy_temp_path /run/diptera-workspace/proxy_temp;
    fastcgi_temp_path /run/diptera-workspace/fastcgi_temp;
    uwsgi_temp_path /run/diptera-workspace/uwsgi_temp;
    scgi_temp_path /run/diptera-workspace/scgi_temp;

    server {
        listen 8090;
        server_name _;
        root /home/dipt-net/dipteraUI/diptera-workspace/dist;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
